name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # The contract lives on GitHub until it is published; keep it current.
      - run: uv lock --upgrade-package earthaccess-plugin-spec
      - run: uv sync --extra test
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
